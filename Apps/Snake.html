<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Snake</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI,Arial;
    color:white;
}


.window{

    width:460px;
    height:650px;

    background:#202020;

    border:2px solid #0078d7;

    border-radius:15px;

    padding:15px;

    text-align:center;

    overflow:hidden;

}



h1{
    margin:5px;
    color:#00aaff;
}



.screen{
    display:none;
}


.show{
    display:block;
}




button{

    width:220px;

    height:45px;

    margin:8px;

    background:#0078d7;

    color:white;

    border:0;

    border-radius:10px;

    font-size:17px;

    cursor:pointer;

}



button:hover{

    background:#009cff;

}



.gameBox{

    position:relative;

    width:400px;

    height:400px;

    margin:auto;

}




canvas{

    width:400px;

    height:400px;

    background:#101820;

    border:3px solid #555;

    border-radius:10px;

}



.info{

    height:30px;

    margin:8px;

    font-size:18px;

}





#gameOver{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);


    width:300px;


    padding:20px;


    background:rgba(0,0,0,.9);


    border:2px solid #ff3333;


    border-radius:15px;


    display:none;


    z-index:5;


}



#gameOver h2{

    color:red;

}



</style>

</head>


<body>


<div class="window">


<h1>🐍 Snake</h1>



<div id="menu" class="screen show">

<h2>Menu</h2>


<button onclick="loadGame()">
▶️ Play and continue
</button>


<br>


<button onclick="startGame()">
🔄 Play new game
</button>


</div>



<div id="game" class="screen">


<div class="gameBox">


<canvas id="canvas" width="400" height="400"></canvas>


<div id="gameOver">

<h2>🛑 Game Over!</h2>

<p>
Skóre:
<span id="endScore">0</span>
</p>


<button onclick="startGame()">
🔄 Restart
</button>


</div>


</div>


<div class="info">

⭐ <span id="score">0</span>

&nbsp;

🏆 <span id="best">0</span>

</div>


<button id="pause">
⏸️ Pause
</button>


<br>


<button onclick="menu()">
🏠 Menu
</button>


</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


let snake = [];
let apple = {};

let dx = 20;
let dy = 0;

let score = 0;

let best =
Number(localStorage.getItem("snakeBest")) || 0;

let running = false;
let paused = false;

let timer;



document.getElementById("best").innerHTML = best;




function show(id){

    document.querySelectorAll(".screen")
    .forEach(
        e=>e.classList.remove("show")
    );


    document.getElementById(id)
    .classList.add("show");

}






function startGame(){

    show("game");

    newGame();

}





function newGame(){

    snake=[

        {x:200,y:200},
        {x:180,y:200},
        {x:160,y:200}

    ];


    dx=20;
    dy=0;


    score=0;

    paused=false;
    running=true;


    document.getElementById("score")
    .innerHTML=score;


    document.getElementById("gameOver")
    .style.display="none";


    document.getElementById("pause")
    .innerHTML="⏸️ Pause";


    apple=createApple();


    clearInterval(timer);


    timer=setInterval(
        update,
        120
    );


    draw();

}





function createApple(){

    let a={

        x:Math.floor(Math.random()*20)*20,

        y:Math.floor(Math.random()*20)*20

    };



    if(
        snake.some(
            p=>p.x===a.x &&
            p.y===a.y
        )
    ){

        return createApple();

    }


    return a;

}







function update(){


    if(!running || paused)
        return;



    let head={

        x:snake[0].x+dx,

        y:snake[0].y+dy

    };





    // průchod přes okraj

    if(head.x<0)
        head.x=380;


    if(head.x>380)
        head.x=0;


    if(head.y<0)
        head.y=380;


    if(head.y>380)
        head.y=0;





    // náraz do sebe

    if(
        snake.some(
            p=>p.x===head.x &&
            p.y===head.y
        )
    ){

        endGame();

        return;

    }





    snake.unshift(head);





    if(
        head.x===apple.x &&
        head.y===apple.y
    ){


        score++;


        document.getElementById("score")
        .innerHTML=score;



        if(score>best){

            best=score;


            localStorage.setItem(
                "snakeBest",
                best
            );


            document.getElementById("best")
            .innerHTML=best;

        }



        apple=createApple();



    }else{


        snake.pop();


    }



    saveGame();


    draw();

}







function draw(){


    ctx.fillStyle="#101820";


    ctx.fillRect(
        0,
        0,
        400,
        400
    );



    drawApple();

    drawSnake();


}







function drawApple(){


    // stín

    ctx.fillStyle="rgba(0,0,0,.35)";


    ctx.beginPath();


    ctx.arc(
        apple.x+11,
        apple.y+14,
        11,
        0,
        Math.PI*2
    );


    ctx.fill();





    // jablko

    let g =
    ctx.createRadialGradient(
        apple.x+6,
        apple.y+5,
        2,
        apple.x+10,
        apple.y+10,
        14
    );



    g.addColorStop(
        0,
        "#ffaaaa"
    );


    g.addColorStop(
        1,
        "#c00000"
    );



    ctx.fillStyle=g;


    ctx.beginPath();


    ctx.arc(
        apple.x+10,
        apple.y+10,
        10,
        0,
        Math.PI*2
    );


    ctx.fill();




    // list

    ctx.fillStyle="#32d353";


    ctx.beginPath();


    ctx.ellipse(
        apple.x+16,
        apple.y+1,
        5,
        3,
        -0.5,
        0,
        Math.PI*2
    );


    ctx.fill();


}

function drawSnake(){


    snake.forEach((p,i)=>{


        ctx.fillStyle =
        i===0
        ? "#b7ff00"
        : (i%2===0 ? "#00c853" : "#00963f");



        ctx.beginPath();


        ctx.roundRect(
            p.x+2,
            p.y+2,
            16,
            16,
            6
        );


        ctx.fill();


    });





    // oči hada

    let h=snake[0];


    ctx.fillStyle="black";


    if(dx>0){

        ctx.fillRect(h.x+13,h.y+4,3,3);
        ctx.fillRect(h.x+13,h.y+13,3,3);

    }
    else if(dx<0){

        ctx.fillRect(h.x+4,h.y+4,3,3);
        ctx.fillRect(h.x+4,h.y+13,3,3);

    }
    else if(dy>0){

        ctx.fillRect(h.x+4,h.y+13,3,3);
        ctx.fillRect(h.x+13,h.y+13,3,3);

    }
    else{

        ctx.fillRect(h.x+4,h.y+4,3,3);
        ctx.fillRect(h.x+13,h.y+4,3,3);

    }


}








// WASD + šipky

document.addEventListener(
"keydown",
e=>{


let k=e.key.toLowerCase();



if(
(k==="w" || e.key==="ArrowUp")
&& dy!==20
){

    dx=0;
    dy=-20;

}



if(
(k==="s" || e.key==="ArrowDown")
&& dy!==-20
){

    dx=0;
    dy=20;

}



if(
(k==="a" || e.key==="ArrowLeft")
&& dx!==20
){

    dx=-20;
    dy=0;

}



if(
(k==="d" || e.key==="ArrowRight")
&& dx!==-20
){

    dx=20;
    dy=0;

}



if(k==="p"){

    pause();

}


});







document.getElementById("pause")
.onclick=pause;






function pause(){

    paused=!paused;


    document.getElementById("pause")
    .innerHTML =

    paused
    ? "▶️ Continue"
    : "⏸️ Pause";


}







function endGame(){


    running=false;


    document.getElementById("endScore")
    .innerHTML=score;


    document.getElementById("gameOver")
    .style.display="block";


    saveGame();


}







function saveGame(){

    localStorage.setItem(
        "snakeSave",
        JSON.stringify({

            snake,
            apple,
            dx,
            dy,
            score

        })
    );

}







function loadGame(){


    let data=
    localStorage.getItem("snakeSave");



    if(data){


        let s=JSON.parse(data);


        snake=s.snake;

        apple=s.apple;

        dx=s.dx;

        dy=s.dy;

        score=s.score;



        document.getElementById("score")
        .innerHTML=score;


        show("game");


        running=true;


        clearInterval(timer);


        timer=setInterval(
            update,
            120
        );


        draw();


    }
    else{

        startGame();

    }

}







function menu(){

    saveGame();

    show("menu");

}






window.addEventListener(
"beforeunload",
saveGame
);


</script>


</div>


</body>

</html>
