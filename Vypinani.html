<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shutting down</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    background: #000;
    color: #fff;

    font-family:
        "Segoe UI Variable",
        "Segoe UI",
        Arial,
        sans-serif;

    cursor: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
}

/* =========================================
   RESTART SCREEN
   ========================================= */

.restart-screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding-bottom: 7vh;
}

/* =========================================
   RESTARTING
   ========================================= */

.restarting {
    color: #fff;

    font-family:
        "Segoe UI Variable",
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 32px;
    font-weight: 600;

    letter-spacing: -0.5px;

    white-space: nowrap;
    line-height: 1;

    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}

/* =========================================
   LOADING KOLEČKO
   ========================================= */

.loading {
    width: 40px;
    height: 40px;

    margin-top: 55px;

    flex-shrink: 0;
}

.loading svg {
    width: 40px;
    height: 40px;

    display: block;

    overflow: visible;

    transform-origin: center;

    animation:
        rotateRing 1.15s linear infinite;
}

.ring {
    fill: none;

    stroke: #fff;

    stroke-width: 4px;

    stroke-linecap: round;
    stroke-linejoin: round;

    /* C tvar */
    stroke-dasharray: 86 22;
    stroke-dashoffset: 0;
}

/* =========================================
   ROTACE
   ========================================= */

@keyframes rotateRing {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* =========================================
   MOBIL
   ========================================= */

@media (max-width: 600px) {

    .restart-screen {
        padding-bottom: 6vh;
    }

    .restarting {
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.3px;
    }

    .loading {
        width: 34px;
        height: 34px;

        margin-top: 48px;
    }

    .loading svg {
        width: 34px;
        height: 34px;
    }

    .ring {
        stroke-width: 3.5px;
    }
}
</style>
</head>

<body>

<div class="restart-screen">

    <div class="restarting">
        Shutting down
    </div>

    <div class="loading">

        <svg
            viewBox="0 0 40 40"
            aria-hidden="true"
        >

            <circle
                class="ring"
                cx="20"
                cy="20"
                r="17"
            />

        </svg>

    </div>

</div>

<script>

/*
    Restarting trvá 5 sekund.
    Potom přejde na přihlášení.
*/

setTimeout(() => {

    window.location.href = "Vypnuto.html";

}, 5000);

</script>

</body>
</html>
