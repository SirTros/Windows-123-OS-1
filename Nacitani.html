<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading Windows 123</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
}

body {
    background: #000000;
    cursor: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* =========================================
   BOOT SCREEN
   ========================================= */

.boot-screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000000;
}

/* =========================================
   LOGO
   ========================================= */

.logo {
    position: absolute;

    top: 24%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 150px;
    height: 150px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.logo img {
    width: 150px;
    height: 150px;

    object-fit: contain;

    display: block;

    user-select: none;
    pointer-events: none;
}

/* =========================================
   BOLD C-KOLEČKO
   ========================================= */

.loading {
    position: absolute;

    left: 50%;
    top: 69%;

    width: 40px;
    height: 40px;

    transform: translate(-50%, -50%);
}

.loading svg {
    width: 40px;
    height: 40px;

    display: block;

    overflow: visible;

    transform-origin: center;

    animation:
        rotateRing 1.15s linear infinite;
}

.ring {
    fill: none;

    stroke: #ffffff;

    /* BOLD */
    stroke-width: 4px;

    /* ZAOBLENÉ KONCE */
    stroke-linecap: round;
    stroke-linejoin: round;

    /*
        C tvar:
        přibližně 20 % kruhu je mezera
    */
    stroke-dasharray: 86 22;
    stroke-dashoffset: 0;
}

/* =========================================
   PLYNULÉ OTÁČENÍ
   ========================================= */

@keyframes rotateRing {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* =========================================
   ZELENÝ FADE OUT
   ========================================= */

#green-transition {
    position: fixed;
    inset: 0;

    background: #008000;

    opacity: 0;

    pointer-events: none;

    z-index: 9999;

    /*
        Plynulý fade
    */
    transition:
        opacity 1.8s cubic-bezier(
            0.22,
            1,
            0.36,
            1
        );
}

#green-transition.active {
    opacity: 1;
}

/* =========================================
   MOBIL
   ========================================= */

@media (max-width: 600px) {

    .logo {
        top: 25%;

        width: 120px;
        height: 120px;
    }

    .logo img {
        width: 120px;
        height: 120px;
    }

    .loading {
        top: 69%;

        width: 34px;
        height: 34px;
    }

    .loading svg {
        width: 34px;
        height: 34px;
    }

    .ring {
        stroke-width: 3.5px;
    }
}

/* =========================================
   VELKÉ MONITORY
   ========================================= */

@media (min-width: 1600px) {

    .logo {
        width: 155px;
        height: 155px;
    }

    .logo img {
        width: 155px;
        height: 155px;
    }

    .loading {
        width: 42px;
        height: 42px;
    }

    .loading svg {
        width: 42px;
        height: 42px;
    }

    .ring {
        stroke-width: 4px;
    }
}
</style>
</head>

<body>

<!-- =========================================
     WINDOWS 123 BOOT
     ========================================= -->

<div class="boot-screen">

    <!-- ZNAČKA -->
    <div class="logo">
        <img
            src="https://sirtros.github.io/Windows-123-OS-1/Pictures/SirTros-logo.png"
            alt=""
        >
    </div>

    <!-- LOADING C-KOLEČKO -->
    <div class="loading">

        <svg
            viewBox="0 0 40 40"
            aria-hidden="true"
        >

            <circle
                class="ring"
                cx="20"
                cy="20"
                r="17"
            />

        </svg>

    </div>

</div>

<!-- ZELENÝ PŘECHOD -->
<div id="green-transition"></div>


<script>

/*
    WINDOWS 123 BOOT

    14,5 sekundy:
    normální boot obrazovka

    1,8 sekundy:
    plynulý fade do zelené

    1 sekunda:
    čekání

    potom:
    Prihlaseni.html
*/

const greenTransition =
    document.getElementById("green-transition");


/* 14,5 sekundy bootování */

setTimeout(() => {

    /* Začátek zeleného fade */

    greenTransition.classList.add("active");


    /*
        Fade trvá 1,8 sekundy.
        Potom čekáme ještě 1 sekundu.
    */

    setTimeout(() => {

        setTimeout(() => {

            window.location.href =
                "Prihlaseni.html";

        }, 1000);

    }, 1800);

}, 10000);

</script>

</body>
</html>
