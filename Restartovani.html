<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restarting</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
}

body {
    background: #000000;
    color: #ffffff;

    font-family:
        "Segoe UI Variable",
        "Segoe UI",
        Arial,
        sans-serif;

    cursor: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
}

/* =========================================
   RESTART SCREEN
   ========================================= */

.restart-screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000000;
}

/* =========================================
   RESTARTING
   ========================================= */

.restarting {
    position: absolute;

    top: 36%;
    left: 50%;

    transform: translate(-50%, -50%);

    color: #ffffff;

    font-family:
        "Segoe UI Variable",
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 32px;

    /* výraznější bold */
    font-weight: 600;

    letter-spacing: -0.4px;

    white-space: nowrap;

    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
}

/* =========================================
   LOADING KOLEČKO
   ========================================= */

.loading {
    position: absolute;

    left: 50%;
    top: 48%;

    width: 38px;
    height: 38px;

    transform: translate(-50%, -50%);
}

.loading svg {
    width: 38px;
    height: 38px;

    display: block;

    overflow: visible;

    transform-origin: center;

    animation:
        rotateRing 1.15s linear infinite;
}

.ring {
    fill: none;

    stroke: #ffffff;

    /* BOLD */
    stroke-width: 4px;

    /* dokonale kulaté konce */
    stroke-linecap: round;
    stroke-linejoin: round;

    /*
        C tvar.
        Přibližně 20 % obvodu tvoří mezera.
    */
    stroke-dasharray: 86 22;

    stroke-dashoffset: 0;
}

/* =========================================
   ROTACE KOLEČKA
   ========================================= */

@keyframes rotateRing {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* =========================================
   ZELENÝ FADE
   ========================================= */

#green-transition {
    position: fixed;
    inset: 0;

    background: #008000;

    opacity: 0;

    pointer-events: none;

    z-index: 9999;

    transition:
        opacity 1.8s
        cubic-bezier(0.22, 1, 0.36, 1);
}

#green-transition.active {
    opacity: 1;
}

/* =========================================
   MOBIL
   ========================================= */

@media (max-width: 600px) {

    .restarting {
        top: 35%;

        font-size: 27px;

        font-weight: 600;

        letter-spacing: -0.3px;
    }

    .loading {
        top: 48%;

        width: 34px;
        height: 34px;
    }

    .loading svg {
        width: 34px;
        height: 34px;
    }

    .ring {
        stroke-width: 3.5px;
    }
}

/* =========================================
   VELKÉ MONITORY
   ========================================= */

@media (min-width: 1600px) {

    .restarting {
        top: 36%;

        font-size: 34px;

        font-weight: 600;
    }

    .loading {
        top: 48%;

        width: 40px;
        height: 40px;
    }

    .loading svg {
        width: 40px;
        height: 40px;
    }

    .ring {
        stroke-width: 4px;
    }
}
</style>
</head>

<body>

<!-- =========================================
     RESTART SCREEN
     ========================================= -->

<div class="restart-screen">

    <!-- TEXT -->
    <div class="restarting">
        Restarting
    </div>

    <!-- LOADING -->
    <div class="loading">

        <svg
            viewBox="0 0 40 40"
            aria-hidden="true"
        >

            <circle
                class="ring"
                cx="20"
                cy="20"
                r="17"
            />

        </svg>

    </div>

</div>


<!-- =========================================
     ZELENÝ PŘECHOD
     ========================================= -->

<div id="green-transition"></div>


<script>

const greenTransition =
    document.getElementById("green-transition");

/*
    14,5 sekundy restartovací obrazovky
*/

setTimeout(() => {

    /* Začátek zeleného fade */

    greenTransition.classList.add("active");


    /*
        Fade trvá 1,8 sekundy.
    */

    setTimeout(() => {

        /*
            Po dokončení fade
            ještě 1 sekundu počkáme.
        */

        setTimeout(() => {

            window.location.href =
                "Prihlaseni.html";

        }, 1000);

    }, 1800);

}, 5500);

</script>

</body>
</html>
