<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shutdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  font-family: "VT323", monospace;
  overflow: hidden;
  user-select: none;
  cursor: none;
}

#message {
  position: fixed;
  top: 0;
  left: 0;
  margin: 0;
  padding: 0;
  font-size: 22px;
  text-align: left;
  line-height: 1.3;
}

#cursor {
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% {
    visibility: hidden;
  }
}
</style>

</head>

<body>

<div id="message">
Press Alt + F4<br>
If it doesn't work, press Fn + Alt + F4<span id="cursor">_</span>
</div>

</body>
</html>
