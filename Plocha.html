


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Windows123 desktop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
body, html {
margin:0;
padding:0;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background-image:url('Pictures/Pozadi.png');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
user-select:none;
}

#desktop{
width:100%;
height:100%;
position:relative;
padding-bottom:50px;
}

.icon{
width:60px;
height:80px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
position:absolute;
border-radius:6px;
color:white;
text-align:center;
}

.icon:hover{
background:rgba(255,255,255,0.2);
}

.icon span{
font-size:36px;
user-select:none;
}

.icon label{
margin-top:4px;
font-size:12px;
line-height:14px;
user-select:none;
white-space:normal;
word-break:break-word;
max-width:60px;
}

.app-window{
position:fixed;
background:#f0f0f0;
border:2px solid #333;
border-radius:8px;
box-shadow:0 0 12px rgba(0,0,0,0.4);
z-index:1000;
display:flex;
flex-direction:column;
overflow:hidden;
}

.app-header{
background:#333;
color:white;
padding:5px 10px;
cursor:move;
user-select:none;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
}

.app-close-btn{
background:none;
border:none;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
line-height:1;
user-select:none;
}

#text-app textarea{
flex-grow:1;
padding:10px;
border:none;
resize:none;
font-size:16px;
font-family:monospace;
outline:none;
width:100%;
box-sizing:border-box;
}

#calc-app{
width:250px;
display:none;
flex-direction:column;
}

#calc-display{
width:100%;
font-size:24px;
padding:8px;
text-align:right;
margin:10px 0;
border:1px solid #ccc;
border-radius:4px;
box-sizing:border-box;
}

#calc-buttons{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
padding:10px;
}

#calc-buttons button{
font-size:18px;
padding:10px;
cursor:pointer;
border-radius:4px;
border:1px solid #999;
background:white;
user-select:none;
transition:background-color 0.2s;
}

#calc-clear{
grid-column:span 4;
background:#f44336;
color:black;
font-weight:bold;
border:none;
}

#taskbar{
position:fixed;
bottom:0;
left:0;
right:0;
height:50px;
background-color:#202020;
display:flex;
align-items:center;
padding:0 10px;
user-select:none;
z-index:2000;
justify-content:space-between;
}

#start-button{
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
user-select:none;
height:50px;
width:50px;
}

#start-button img{
height:30px;
width:30px;
object-fit:contain;
display:block;
}

#datetime{
color:white;
margin-right:10px;
font-size:12px;
font-weight:bold;
display:flex;
flex-direction:column;
justify-content:center;
height:50px;
user-select:none;
text-align:right;
}

#datetime #time{
font-size:16px;
line-height:1;
}

#datetime #date{
font-size:12px;
line-height:1;
}

#taskmanager-app{
width:600px;
height:600px;
display:none;
flex-direction:column;
}

.tm-content{
background:#fff;
color:#111;
flex:1;
padding:15px;
font-family:"Segoe UI";
}

.tm-header{
font-size:22px;
margin-bottom:15px;
}

.tm-box{
background:#eee;
border-radius:10px;
padding:12px;
margin-bottom:10px;
}

.tm-process{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #ccc;
}


#files-app{
width:320px;
height:360px;
display:none;
flex-direction:column;
position:fixed;
top:80px;
left:120px;
background:#f0f0f0;
border:2px solid #333;
border-radius:8px;
box-shadow:0 0 12px rgba(0,0,0,0.4);
z-index:1000;
overflow-y:auto;
padding:10px;
box-sizing:border-box;
}


#files-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}


#files-list .file-icon{
width:60px;
height:80px;
display:flex;
flex-direction:column;
align-items:center;
cursor:pointer;
user-select:none;
color:white;
border-radius:6px;
text-align:center;
}


#files-list .file-icon span{
font-size:36px;
user-select:none;
}


#files-list .file-icon label{
font-size:12px;
margin-top:4px;
white-space:normal;
word-break:break-word;
max-width:60px;
color: black;
}


#files-list .file-icon:hover{
background:rgba(0,0,0,0.1);
}


#toastContainer{
position:fixed;
top:10px;
right:10px;
z-index:9999;
}


.toast{
background:#fff;
color:#000;
padding:10px 20px;
border-radius:5px;
box-shadow:0 0 5px black;
font-family:monospace;
opacity:0;
transition:opacity 0.3s;
}


#volume-toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(50,50,50,0.9);
color:white;
padding:8px 16px;
border-radius:8px;
font-size:16px;
display:none;
z-index:5000;
}


#terminal-output,
#terminal-input{
font-family:'Press Start 2P',monospace;
}


#start-menu-new{
position:fixed;
bottom:60px;
left:10px;
width:340px;
height:450px;
background:#111;
color:white;
border:1px solid #555;
border-radius:18px;
display:flex;
flex-direction:column;
padding:15px;
z-index:5000;
font-family:"Segoe UI";
box-shadow:0 10px 30px #000;

transform:translateY(40px) scale(.95);
opacity:0;
pointer-events:none;
transition:0.25s ease;
}


#start-menu-new.open{
transform:translateY(0) scale(1);
opacity:1;
pointer-events:auto;
}


#start-search{
height:35px;
border-radius:10px;
border:1px solid #555;
background:#222;
color:white;
padding:0 12px;
font-size:16px;
}


#start-apps{
flex:1;
overflow-y:auto;
margin-top:10px;
scroll-behavior:smooth;
}


.start-app{
display:flex;
align-items:center;
gap:12px;
padding:10px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}


.start-app:hover{
background:#333;
}


#start-bottom{
display:flex;
align-items:center;
justify-content:space-between;
position:relative;
padding-top:10px;
border-top:1px solid #444;
}


#user-box{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
}


#user-box img{
width:38px;
height:38px;
border-radius:50%;
background:white;
padding:3px;
box-sizing:border-box;
}

#power-button{
font-size:28px;
cursor:pointer;
padding:8px;
border-radius:10px;
}


#power-button:hover{
background:#333;
}

#power-menu{
position:absolute;
right:0;
bottom:55px;

display:flex;
flex-direction:column;
gap:5px;

background:#222;
border:1px solid #555;
border-radius:12px;
padding:8px;

width:150px;

box-shadow:0 5px 20px #000;

opacity:0;
transform:translateY(20px) scale(.95);
pointer-events:none;
transition:.2s ease;
}


#power-menu.open{
opacity:1;
transform:translateY(0) scale(1);
pointer-events:auto;
}


#power-menu button{
width:100%;
background:none;
border:0;
color:white;
padding:10px;
text-align:left;
border-radius:8px;
cursor:pointer;
}


#power-menu button:hover{
background:#444;
}


#start-menu{
transform:translateY(20px) scale(.95);
opacity:0;
pointer-events:none;
transition:.2s ease;
}


#start-menu.open{
transform:translateY(0) scale(1);
opacity:1;
pointer-events:auto;
}


#start-menu button{
background:none;
border:none;
padding:10px;
font-size:14px;
cursor:pointer;
border-bottom:1px solid #ccc;
text-align:left;
}


#start-menu button:last-child{
border-bottom:none;
}


#start-menu button:hover{
background:#eee;
}


#start-apps::-webkit-scrollbar{
width:8px;
}


#start-apps::-webkit-scrollbar-thumb{
background:#666;
border-radius:10px;
}


.tm-list{
margin-top:10px;
}


.tm-system{
color:red;
font-weight:bold;
}


.tm-button{
padding:8px 15px;
border-radius:8px;
border:none;
cursor:pointer;
}

#system-area{
    display:flex;
    align-items:center;
    gap:8px;
    color:white;
}

.system-icon{
    font-size:24px;
    cursor:pointer;
    padding:6px;
    border-radius:8px;
}

.system-icon:hover{
    background:rgba(255,255,255,0.15);
}

#battery{
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

#right-taskbar{
    display:flex;
    align-items:center;
    gap:15px;
}

#system-icons{
    display:flex;
    align-items:center;
    gap:0px;
}

.system-icon{
    font-size:24px;
    color:white;
}

#battery-area{
    display:flex;
    align-items:center;
    gap:5px;
    color:white;
}

#battery-icon{
    font-size:26px;
}

#battery-percent{
    font-size:14px;
    font-weight:bold;
}

.separator{
    color:white;
    font-size:20px;
}

#games-list{
display:flex;
flex-wrap:wrap;
gap:10px;
padding:10px;
}

#games-list .file-icon{
width:60px;
height:80px;
display:flex;
flex-direction:column;
align-items:center;
cursor:pointer;
user-select:none;
color:black;
border-radius:6px;
text-align:center;
}

#games-list .file-icon span{
font-size:36px;
}

#games-list .file-icon label{
font-size:12px;
margin-top:4px;
}

#games-list .file-icon:hover{
background:rgba(0,0,0,0.1);
}


#snake-app{
    resize:both;
    overflow:auto;
    min-width:300px;
    min-height:730px;
}


/* =========================================================
   WINDOWS123 - MOBILNÍ VERZE
   Počítačová verze zůstává beze změny
   ========================================================= */

@media (max-width: 700px) {

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: manipulation;
    }

    #desktop {
        width: 100%;
        height: 100%;
        padding-bottom: 58px;
    }

    /* =========================
       IKONY NA PLOŠE
       ========================= */

    .icon {
        width: 72px;
        height: 76px;
        border-radius: 10px;
        z-index: 10;
    }

    .icon span {
        font-size: 34px;
    }

    .icon label {
        font-size: 11px;
        line-height: 13px;
        max-width: 68px;
    }

    .icon:hover {
        background: rgba(255,255,255,0.18);
    }

    /* Mobilní rozmístění ikon */
    #icon-text {
        top: 12px !important;
        left: 10px !important;
    }

    #icon-calc {
        top: 12px !important;
        left: 88px !important;
    }

    #icon-paint {
        top: 12px !important;
        left: 166px !important;
    }

    #icon-files {
        top: 12px !important;
        left: 244px !important;
    }

    #icon-clock {
        top: 12px !important;
        left: 322px !important;
    }

    #icon-taskmanager {
        top: 92px !important;
        left: 10px !important;
    }

    #icon-terminal {
        top: 92px !important;
        left: 88px !important;
    }

    #icon-games {
        top: 92px !important;
        left: 166px !important;
    }


    /* =========================
       VŠECHNA OKNA
       ========================= */

    .app-window {
        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 75px);
        box-sizing: border-box;
        border-width: 2px;
        border-radius: 10px;
    }

    .app-header {
        min-height: 38px;
        padding: 7px 10px;
        box-sizing: border-box;
        font-size: 15px;
        flex-shrink: 0;
    }

    .app-close-btn {
        font-size: 25px;
        width: 36px;
        height: 30px;
        padding: 0;
    }


    /* =========================
       NOTEPAD
       ========================= */

    #text-app {
        width: calc(100vw - 20px) !important;
        height: calc(100vh - 110px) !important;
        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 75px);
        left: 10px !important;
        top: 55px !important;
    }

    #text-app textarea {
        font-size: 16px;
        padding: 10px;
    }


    /* =========================
       CALCULATOR
       ========================= */

    #calc-app {
        width: calc(100vw - 20px) !important;
        max-width: 340px;
        left: 10px !important;
        top: 65px !important;
    }

    #calc-display {
        font-size: 25px;
        height: 52px;
        margin: 8px;
        width: calc(100% - 16px);
    }

    #calc-buttons {
        gap: 6px;
        padding: 8px;
    }

    #calc-buttons button {
        min-height: 52px;
        font-size: 20px;
        padding: 8px;
    }

    #calc-clear {
        min-height: 48px;
    }


    /* =========================
       PAINT
       ========================= */

    #paint-app {
        width: calc(100vw - 20px) !important;
        height: calc(100vh - 100px) !important;
        max-width: 600px;
        left: 10px !important;
        top: 50px !important;
    }

    #paint-canvas {
        width: calc(100% - 20px);
        height: auto;
        max-height: calc(100% - 100px);
        margin: 10px;
        box-sizing: border-box;

        
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }

    #paint-toolbar {
        flex-wrap: wrap;
        padding: 5px 10px 8px 10px !important;
        gap: 8px !important;
    }

    #paint-toolbar button {
        min-height: 38px;
        padding: 7px 14px;
    }

    #paint-color {
        width: 50px;
        height: 38px;
    }


    /* =========================
       FILES
       ========================= */

    #files-app {
        width: calc(100vw - 20px) !important;
        height: calc(100vh - 100px) !important;
        max-width: 500px;
        max-height: calc(100vh - 75px);
        left: 10px !important;
        top: 50px !important;
        padding: 8px;
    }

    #files-list {
        gap: 8px;
        margin-top: 8px;
        justify-content: flex-start;
    }

    #files-list .file-icon {
        width: 68px;
        height: 78px;
    }

    #files-list .file-icon span {
        font-size: 34px;
    }

    #files-list .file-icon label {
        font-size: 11px;
        max-width: 68px;
    }


    /* =========================
       TERMINAL
       ========================= */

    #terminal-app {
        width: calc(100vw - 20px) !important;
        height: calc(100vh - 100px) !important;
        max-width: 700px;
        left: 10px !important;
        top: 50px !important;
    }

    #terminal-output {
        font-size: 11px;
        line-height: 16px;
        padding: 8px;
        overflow-x: auto;
    }

    #terminal-input {
        height: 42px;
        font-size: 13px !important;
        padding: 8px !important;
        box-sizing: border-box;
        width: 100%;
    }


    /* =========================
       CLOCK
       ========================= */

    #clock-app {
        width: calc(100vw - 20px) !important;
        max-width: 400px;
        height: 230px !important;
        left: 10px !important;
        top: 80px !important;
    }

    #clock-time {
        font-size: 42px !important;
    }

    #clock-date {
        font-size: 16px !important;
        padding: 0 10px;
        text-align: center;
    }


    /* =========================
       TASK MANAGER
       ========================= */

    #taskmanager-app {
        width: calc(100vw - 20px) !important;
        height: calc(100vh - 100px) !important;
        max-width: 700px;
        left: 10px !important;
        top: 50px !important;
    }

    .tm-content {
        padding: 10px;
        overflow-y: auto;
    }

    .tm-header {
        font-size: 21px;
        margin-bottom: 10px;
    }

    .tm-box {
        padding: 10px;
        margin-bottom: 8px;
    }

    .tm-process {
        padding: 10px 6px;
        font-size: 13px;
        gap: 10px;
    }


    /* =========================
       GAMES
       ========================= */

    #games-app {
        width: calc(100vw - 20px) !important;
        height: 300px !important;
        max-width: 400px;
        left: 10px !important;
        top: 80px !important;
    }

    #games-list {
        gap: 8px;
        padding: 8px;
    }

    #games-list .file-icon {
        width: 68px;
        height: 78px;
    }

    #games-list .file-icon span {
        font-size: 34px;
    }

    #games-list .file-icon label {
        font-size: 11px;
    }


    /* =========================
       SNAKE
       ========================= */

    #snake-app {
        width: calc(100vw - 20px) !important;
        height: calc(100vh - 85px) !important;

        min-width: 0 !important;
        min-height: 0 !important;

        max-width: calc(100vw - 20px);
        max-height: calc(100vh - 70px);

        left: 10px !important;
        top: 45px !important;

        resize: none;
    }

    #snake-app iframe {
        width: 100% !important;
        height: 100% !important;
        min-width: 0 !important;
        border: none;
    }


    /* =========================
       START MENU
       ========================= */

    #start-menu-new {
        left: 8px;
        bottom: 64px;

        width: calc(100vw - 16px);
        max-width: 430px;

        height: min(520px, calc(100vh - 90px));

        padding: 12px;
        border-radius: 18px;
        box-sizing: border-box;
    }

    #start-search {
        height: 42px;
        font-size: 16px;
        box-sizing: border-box;
    }

    #start-menu-new h3 {
        margin: 12px 4px 8px;
        font-size: 17px;
    }

    .start-app {
        min-height: 48px;
        padding: 8px 10px;
        gap: 12px;
        font-size: 16px;
        box-sizing: border-box;
    }

    .start-app span:first-child {
        font-size: 27px !important;
        width: 34px;
        text-align: center;
    }

    #start-bottom {
        padding-top: 9px;
    }

    #user-box img {
        width: 40px;
        height: 40px;
    }

    #user-box {
        font-size: 15px;
    }

    #power-button {
        font-size: 30px;
        padding: 7px;
    }

    #power-menu {
        right: 0;
        bottom: 55px;
        width: 170px;
    }

    #power-menu button {
        min-height: 44px;
        font-size: 15px;
    }


    /* =========================
       TASKBAR
       ========================= */

    #taskbar {
        height: 58px;
        padding: 0 8px;
        box-sizing: border-box;
    }

    #start-button {
        width: 52px;
        height: 58px;
        flex-shrink: 0;
    }

    #start-button img {
        width: 34px;
        height: 34px;
    }

    #right-taskbar {
        gap: 7px;
        height: 58px;
    }

    #system-icons {
        gap: 0;
    }

    #battery-area {
        gap: 3px;
    }

    #battery-icon {
        font-size: 23px;
    }

    #battery-percent {
        font-size: 12px;
    }

    .separator {
        font-size: 18px;
    }

    #datetime {
        margin-right: 3px;
        height: 58px;
    }

    #datetime #time {
        font-size: 14px;
    }

    #datetime #date {
        font-size: 10px;
    }


    /* =========================
       TOAST
       ========================= */

    #toastContainer {
        top: 8px;
        right: 8px;
        left: 8px;
    }

    .toast {
        padding: 10px 14px;
        font-size: 13px;
        max-width: calc(100vw - 40px);
    }

    #volume-toast {
        bottom: 70px;
        max-width: calc(100vw - 40px);
        text-align: center;
        font-size: 15px;
    }
}

   MENŠÍ TELEFONY
   ========================================================= */

        width: 65px;
        height: 72px;
    }

    .icon span {
        font-size: 31px;
    }

    .icon label {
        font-size: 10px;
        max-width: 63px;
    }

        left: 5px !important;
    }

    #icon-calc {
        left: 75px !important;
    }

    #icon-paint {
        left: 145px !important;
    }

    #icon-files {
        left: 215px !important;
    }

    #icon-clock {
        left: 285px !important;
    }

    #icon-taskmanager {
        left: 5px !important;
        top: 85px !important;
    }

    #icon-terminal {
        left: 75px !important;
        top: 85px !important;
    }

    #icon-games {
        left: 145px !important;
        top: 85px !important;
    }

    #right-taskbar {

    #battery-percent {

    .separator {

    #datetime #time {

// restart pouze Windows123 plochy

const iconFiles = document.getElementById('icon-files'),

const textArea = textApp.querySelector('textarea'),

const appsForFiles = [
    {name:'Files', icon:'📁', appEl: filesApp},

function populateFilesApp() {

        fileIcon.className = 'file-icon';

// --- Desktop icons double-click ---
iconFiles.ondblclick = () => showApp(filesApp);
iconText.ondblclick = () => showApp(textApp);
iconCalc.ondblclick = () => showApp(calcApp);
iconPaint.ondblclick = () => showApp(paintApp);

iconClock.ondblclick = () => { showApp(clockApp); updateClock(); };

// --- Close buttons ---
document.getElementById('files-app-close').onclick = () => filesApp.style.display='none';
document.getElementById('text-app-close').onclick = () => textApp.style.display='none';
document.getElementById('calc-app-close').onclick = () => calcApp.style.display='none';
document.getElementById('paint-app-close').onclick = () => paintApp.style.display='none';
document.getElementById('terminal-app-close').onclick = () => terminalApp.style.display='none';
document.getElementById('clock-app-close').onclick = () => clockApp.style.display='none';

// --- Show app (all apps can be open without limit) ---
function showApp(app) {
    if(app.style.display === 'flex') return; // Already open
    app.style.display = 'flex';
    bringToFront(app);
}

// --- Draggable windows ---
function makeDraggable(el) {
    const header = el.querySelector('.app-header');
    if(!header) return;
    header.addEventListener('mousedown', e => {
        let offsetX = e.clientX - el.offsetLeft,
            offsetY = e.clientY - el.offsetTop;
        bringToFront(el);
        function onMouseMove(e) {
            el.style.left = (e.clientX - offsetX) + 'px';
            el.style.top = (e.clientY - offsetY) + 'px';
        }
        function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
    });
}

[filesApp, textApp, calcApp, paintApp, terminalApp, clockApp, taskmanagerApp].forEach(makeDraggable);

// --- Bring to front ---
function bringToFront(el) {
    const highestZ = Array.from(document.querySelectorAll('.app-window'))
        .map(e => parseInt(getComputedStyle(e).zIndex) || 0)
        .reduce((max, z) => Math.max(max, z), 1000);
    el.style.zIndex = highestZ + 1;
}

// --- Calculator ---
const calcDisplay = document.getElementById('calc-display');
let currentInput = '';

document.querySelectorAll('.calc-btn').forEach(btn => btn.onclick = () => {
    currentInput += btn.textContent;
    calcDisplay.value = currentInput;
});

document.getElementById('calc-equal').onclick = () => {
    try {
        let expression = currentInput.replace(',', '.');
        let result = Function(`'use strict'; return (${expression})`)();
        calcDisplay.value = result;
        currentInput = result.toString();
    } catch {
        calcDisplay.value = 'ERROR';
        currentInput = '';
    }
};

document.getElementById('calc-clear').onclick = () => { currentInput = ''; calcDisplay.value = ''; };

// --- Clock ---
const clockTime = document.getElementById('clock-time');
const clockDate = document.getElementById('clock-date');

function updateClock() {
    const now = new Date();
    clockTime.textContent = now.toLocaleTimeString("en-GB");
    clockDate.textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

setInterval(() => { if(clockApp.style.display === 'flex') updateClock(); }, 1000);

// =====================================================
// WINDOWS123 — PAINT V2
// Myš + dotyk + stylus
// =====================================================

const canvas = document.getElementById('paint-canvas');
const ctx = canvas.getContext('2d');

const colorPicker = document.getElementById('paint-color');
const paintClearBtn = document.getElementById('paint-clear-btn');

let drawing = false;
let lastX = 0;
let lastY = 0;

// Lepší kvalita kreslení
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.lineWidth = 4;

// -----------------------------------------------------
// Převod pozice myši/prstu na canvas
// -----------------------------------------------------

function getCanvasPosition(e) {

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

// -----------------------------------------------------
// Začátek kreslení
// -----------------------------------------------------

function startDrawing(e) {

    e.preventDefault();

    drawing = true;

    const pos = getCanvasPosition(e);

    lastX = pos.x;
    lastY = pos.y;

    // Zachytí prst/stylus i mimo canvas
    if (canvas.setPointerCapture) {
        try {
            canvas.setPointerCapture(e.pointerId);
        } catch {}
    }
}

// -----------------------------------------------------
// Kreslení
// -----------------------------------------------------

function draw(e) {

    if (!drawing) return;

    e.preventDefault();

    const pos = getCanvasPosition(e);

    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();

    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);

    ctx.stroke();

    lastX = pos.x;
    lastY = pos.y;
}

// -----------------------------------------------------
// Konec kreslení
// -----------------------------------------------------

function stopDrawing(e) {

    if (!drawing) return;

    drawing = false;

    if (e && canvas.releasePointerCapture) {
        try {
            canvas.releasePointerCapture(e.pointerId);
        } catch {}
    }

    savePaintToLocalStorage();
}

// -----------------------------------------------------
// POINTER EVENTS
// Funguje:
// 🖱️ myš
// 👆 prst
// ✏️ stylus
// -----------------------------------------------------

canvas.addEventListener('pointerdown', startDrawing);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointercancel', stopDrawing);

// Zabrání posouvání stránky při kreslení
canvas.style.touchAction = 'none';

// -----------------------------------------------------
// Uložení obrázku
// -----------------------------------------------------

function savePaintToLocalStorage() {

    try {

        localStorage.setItem(
            'paintImage',
            canvas.toDataURL('image/png')
        );

    } catch (error) {

        console.warn(
            'Windows123 Paint: nepodařilo se uložit obrázek.',
            error
        );

    }

}

// -----------------------------------------------------
// Načtení obrázku
// -----------------------------------------------------

function loadPaintFromLocalStorage() {

    const data = localStorage.getItem('paintImage');

    if (!data) return;

    const img = new Image();

    img.onload = () => {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

    };

    img.src = data;
}

// Načíst uložený obrázek
loadPaintFromLocalStorage();

// -----------------------------------------------------
// Vymazání
// -----------------------------------------------------

paintClearBtn.addEventListener('click', () => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    localStorage.removeItem('paintImage');

});

function updateDateTime(){

    document.getElementById('time').textContent =

}

updateDateTime();
setInterval(updateDateTime,1000);

// --- Terminal ---
const terminalInput = document.getElementById('terminal-input');
const terminalOutput = document.getElementById('terminal-output');
const commands = ['help','run (app)','time','date','shutdown','restart','lock','echo (text)','about','apps','update','bsod','som'];

terminalInput.addEventListener('keydown', e => { if(e.key==='Enter'){ const cmd = terminalInput.value.trim(); terminalInput.value=''; handleTerminalCommand(cmd); }});

function printTerminal(text) { terminalOutput.innerHTML += '<br>' + text; terminalOutput.scrollTop = terminalOutput.scrollHeight; }

function handleTerminalCommand(cmd) {
    if(!cmd) return;
    const parts = cmd.split(" ");
    const main = parts[0].toLowerCase();
    const arg = parts.slice(1).join(" ");

    switch(main){
        case 'help': printTerminal('Commands: '+commands.join(', ')); break;
        case 'time': printTerminal('Current time: '+new Date().toLocaleTimeString()); break;
        case 'date': printTerminal('Current date: '+new Date().toLocaleDateString()); break;
        case 'about': printTerminal('Windows123 OS 1.9'); break;
        case 'update': printTerminal('Windows123 All OK.'); break;
        case 'apps': printTerminal('Apps: Notepad, Calculator, Paint, Clock, Files, Terminal, Taskmgr, Games, SnakeGame'); break;
        case 'echo': if(arg) printTerminal(arg); else printTerminal('Usage: echo [text]'); break;

        case 'run':
            const appName = arg.toLowerCase();
            switch(appName){
                case 'notepad': showApp(textApp); break;
                case 'calculator': showApp(calcApp); break;
                case 'paint': showApp(paintApp); break;
                case 'clock': showApp(clockApp); break;
                case 'files': showApp(filesApp); break;
                case 'terminal': showApp(terminalApp); break;
                case 'cmd': showApp(terminalApp); break;
                case 'taskmgr': showApp(taskmanagerApp); break;
                case 'games': showApp(gamesApp); break;
                case 'snakegame': showApp(snakeApp); break;
                default: printTerminal('Unknown app: '+appName);
            }
            break;

        case 'shutdown': window.location.href='Vypinani.html'; break;
        case 'restart': window.location.href='Restartovani.html'; break;
        case 'bsod': window.location.href='Start-Error.html'; break;
        case 'som': window.location.href='SOM.html'; break;
        case 'lock': window.location.href='Zamykani.html'; break;
        default: printTerminal('Unknown command: '+main);
    }
}

// --- Allow running commands from console ---
window.runCmdFromConsole = function(cmd){
    handleTerminalCommand(cmd);
    console.log('Command executed in Windows123 CMD: ' + cmd);
};

};

document.addEventListener("click",(e)=>{

    if(!newStart.contains(e.target) && !startButton.contains(e.target)){
        
        if(powerMenu.classList.contains("open")){
        powerMenu.classList.remove("open");
        }else{
        newStart.classList.remove("open");
}

    }

});


document.addEventListener("keydown",(e)=>{
    if(e.key==="Meta" || e.key==="OS" || e.key==="Win"){
        newStart.classList.remove("open");
        powerMenu.style.display="none";
    }
});


// ===== Windows123 Battery =====

if(navigator.getBattery){

navigator.getBattery().then((battery)=>{

function updateBattery(){

let level=Math.round(battery.level * 100);

let icon = "battery_android_frame_full";

if(battery.charging){
    icon = "battery_android_frame_bolt";
}
else if(level >= 90){
    icon = "battery_android_frame_full";
}
else if(level >= 70){
    icon = "battery_android_frame_6";
}
else if(level >= 50){
    icon = "battery_android_frame_5";
}
else if(level >= 30){
    icon = "battery_android_frame_4";
}
else if(level >= 10){
    icon = "battery_android_frame_2";
}
else{
    icon = "battery_android_0";
}


// správná změna ikony
let batteryIcon = document.getElementById("battery-icon");

batteryIcon.innerHTML = icon;


document.getElementById("battery-percent").textContent = level + "%";

}


updateBattery();

battery.addEventListener("levelchange", updateBattery);
battery.addEventListener("chargingchange", updateBattery);

});

}
